name: Bug report
description: Something in an add-on, or in this repository's tooling, does not work.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not include personal information in this issue — not in the
        text, not in screenshots, and not in attached files.

  - type: dropdown
    id: addon
    attributes:
      label: Which add-on?
      description: |
        Add a new option to this list whenever an add-on is added to the
        repository; see CONTRIBUTING.md.
      options:
        - Repository tooling (build, CI, catalog)
        - Other / not listed
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Add-on version
      description: The version you installed, e.g. 1.2.0. Leave blank for tooling issues.
      placeholder: "1.2.0"

  - type: dropdown
    id: platform
    attributes:
      label: Where does it happen?
      options:
        - Client (single-player or a local world)
        - Dedicated server (BDS)
        - Dedicated server in Docker
        - Both client and server
    validations:
      required: true

  - type: input
    id: minecraft
    attributes:
      label: Minecraft version
      placeholder: "1.21.0"
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: What you expected, and what actually happened instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Enable the pack on a new world
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: |
        Server console output if you have it. Check it for your world name,
        file paths or IP addresses before pasting.
      render: text
