version: 2

updates:
  # The workflows pin actions to a commit SHA, so this is what keeps those
  # pins current. Dependabot rewrites the SHA and the trailing version comment
  # together.
  #
  # There is deliberately no ecosystem for the tooling in scripts/: it is
  # Python 3 standard library only, with no dependencies to update.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
